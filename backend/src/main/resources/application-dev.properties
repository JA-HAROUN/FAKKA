# Local development profile: in-memory H2, no external database required.
# Activate with: mvnw spring-boot:run -Dspring-boot.run.profiles=dev
#   or:          SPRING_PROFILES_ACTIVE=dev

# MODE=MySQL keeps H2 tolerant of MySQL-flavoured SQL so dev and prod behave alike.
spring.datasource.url=jdbc:h2:mem:fakka;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Schema is rebuilt every start, so the in-memory database always matches the entities.
spring.jpa.hibernate.ddl-auto=create-drop

# Browse the in-memory database at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
