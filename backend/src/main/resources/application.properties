spring.application.name=fakka

# --- Datasource -------------------------------------------------------------
# Placeholders only: supply real values via environment variables, never commit them.
# Startup fails fast if DB_USERNAME/DB_PASSWORD are unset, which is deliberate --
# run the "dev" profile for local work against in-memory H2 instead.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/fakka?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# --- JPA --------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
# spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- Errors -----------------------------------------------------------------
# Unmapped paths must reach GlobalExceptionHandler as NoResourceFoundException so
# that 404s use the same JSON shape as every other error.
spring.web.resources.add-mappings=false
server.error.whitelabel.enabled=false

# --- API docs ---------------------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.model-and-view.enabled=false

# --- Natural-language expense parser (FR-20 to FR-23) ------------------------
# No key set here on purpose: an absent ANTHROPIC_API_KEY leaves the feature
# reporting itself unavailable (503, "fall back to manual entry") rather than
# failing the whole application (BR-7). Supply the key via the environment,
# never commit one.
fakka.ai.enabled=${FAKKA_AI_ENABLED:true}
fakka.ai.api-key=${FAKKA_AI_API_KEY:}
fakka.ai.base-url=${FAKKA_AI_BASE_URL:}
fakka.ai.model=${FAKKA_AI_MODEL:}
fakka.ai.max-tokens=${FAKKA_AI_MAX_TOKENS:0}
fakka.ai.effort=${FAKKA_AI_EFFORT:}
fakka.ai.timeout=${FAKKA_AI_TIMEOUT:20s}

# --- Receipt OCR parser (FR-24 to FR-28) ------------------------------------
# No key set here on purpose: an absent OCRSPACE_API_KEY leaves the feature
# reporting itself unavailable (503, "enter items manually instead") rather than
# failing the whole application (BR-7, FR-28). Supply the key via the environment,
# never commit one.
fakka.ocr.enabled=${FAKKA_OCR_ENABLED:true}
fakka.ocr.api-key=${OCRSPACE_API_KEY:}
fakka.ocr.base-url=${FAKKA_OCR_BASE_URL:}
fakka.ocr.timeout=${FAKKA_OCR_TIMEOUT:20s}
fakka.ocr.max-file-size-bytes=${FAKKA_OCR_MAX_FILE_SIZE_BYTES:0}
